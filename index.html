<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Космо-математика</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <!-- ГЛАВНЫЙ ЭКРАН: карта планет -->
  <section id="home" class="screen active">
    <header class="top">
      <div class="pill" id="home-stars">⭐ 0</div>
      <button class="icon-btn" id="btn-album" aria-label="Альбом наклеек">🎒</button>
      <button class="icon-btn" id="btn-gear" aria-label="Для родителей">⚙️</button>
    </header>
    <h1 class="title">Космо-<br>математика</h1>
    <div class="map" id="map"></div>
    <button class="big-btn primary" id="btn-start">🚀 Полетели!</button>
  </section>

  <!-- ИНТРО ПЛАНЕТЫ -->
  <section id="intro" class="screen">
    <header class="top">
      <button class="icon-btn" id="btn-intro-back" aria-label="Назад">⬅️</button>
      <span class="spacer" style="flex:1"></span>
    </header>
    <div class="intro-card">
      <div class="intro-planet" id="intro-planet">🌙</div>
      <h2 id="intro-title">Луна</h2>
      <div class="mascot intro-mascot">
        <span class="face">👽</span>
        <div class="bubble"><div class="prompt small" id="intro-story"></div></div>
      </div>
      <button class="big-btn primary" id="btn-go">Поехали! 🚀</button>
    </div>
  </section>

  <!-- ЭКРАН ЗАДАНИЯ -->
  <section id="game" class="screen">
    <header class="top">
      <button class="icon-btn" id="btn-quit" aria-label="Домой">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="pill" id="game-stars">⭐ 0</div>
    </header>
    <div class="task">
      <div class="mascot">
        <span class="face" id="face">👽</span>
        <div class="bubble"><div class="scene" id="scene"></div><div class="prompt" id="prompt"></div></div>
        <button class="icon-btn speak" id="btn-speak" aria-label="Прочитать вслух">🔊</button>
      </div>
      <div class="combo" id="combo" hidden></div>
      <div class="stage" id="stage"></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- ЭКРАН РЕЗУЛЬТАТА МИССИИ -->
  <section id="result" class="screen">
    <div class="result-card">
      <div class="result-planet" id="result-planet">🪐</div>
      <h2 id="result-title">Планета открыта!</h2>
      <div class="result-stars" id="result-stars"></div>
      <div class="sticker-earned" id="sticker-earned" hidden>
        <div class="sticker-label">Новая наклейка!</div>
        <div class="sticker-big" id="sticker-big">👽</div>
      </div>
      <button class="big-btn primary" id="btn-next">Дальше 🚀</button>
      <button class="big-btn" id="btn-home">Домой</button>
    </div>
  </section>

  <!-- АЛЬБОМ НАКЛЕЕК -->
  <section id="album" class="screen">
    <header class="top">
      <button class="icon-btn" id="btn-album-back" aria-label="Назад">⬅️</button>
      <div class="pill">Мои наклейки</div>
      <span class="spacer"></span>
    </header>
    <div class="album-grid" id="album-grid"></div>
  </section>

  <!-- РОДИТЕЛЬСКИЙ РАЗДЕЛ -->
  <section id="parent" class="screen parent">
    <header class="top">
      <button class="icon-btn" id="btn-parent-back" aria-label="Назад">⬅️</button>
      <div class="pill">Для родителей</div>
      <span class="spacer"></span>
    </header>
    <div class="parent-body" id="parent-body"></div>
  </section>

  <!-- ЗАМОК ДЛЯ РОДИТЕЛЕЙ -->
  <div class="modal" id="gate" hidden>
    <div class="modal-card">
      <div class="gate-q" id="gate-q">7 × 8 = ?</div>
      <input class="gate-input" id="gate-input" type="number" inputmode="numeric" placeholder="ответ">
      <div class="row">
        <button class="big-btn" id="gate-cancel">Отмена</button>
        <button class="big-btn primary" id="gate-ok">Войти</button>
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
